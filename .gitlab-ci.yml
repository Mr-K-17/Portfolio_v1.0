workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

image: node:20-alpine

stages:
  - validate
  - build
  - deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

validate:
  stage: validate
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run check:assets
    - npx tsc --noEmit

build:
  stage: build
  variables:
    VITE_BASE: "/"
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run build
    - |
      # Guard check: Ensure no .mp4 is in dist/ and dist does not exceed 30MB
      if find dist -type f -name "*.mp4" | grep -q .; then
        echo "ERROR: Forbidden .mp4 files detected in dist output!"
        find dist -type f -name "*.mp4"
        exit 1
      fi
      DIST_SIZE_KB=$(du -sk dist | awk '{print $1}')
      echo "dist output size: ${DIST_SIZE_KB} KB"
      if [ "$DIST_SIZE_KB" -gt 30720 ]; then
        echo "ERROR: dist directory exceeds 30MB limit (${DIST_SIZE_KB} KB > 30720 KB)"
        exit 1
      fi
      echo "Dist guard verification passed: 0 .mp4 files, size under 30MB."
  artifacts:
    name: "$CI_COMMIT_REF_SLUG-dist"
    expire_in: 1 week
    paths:
      - dist/

deploy:
  stage: deploy
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "release"'
  needs:
    - build
  before_script:
    - which curl || apk add --no-cache curl
  script:
    - |
      if [ -z "$RENDER_DEPLOY_HOOK" ]; then
        echo "ERROR: Missing required variable RENDER_DEPLOY_HOOK!"
        echo "Add RENDER_DEPLOY_HOOK in GitLab: Settings -> CI/CD -> Variables (Masked, Protected)."
        exit 1
      fi
      echo "Triggering Render automated deployment..."
      curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK"
      echo "Render deployment hook triggered successfully."
