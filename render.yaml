services:
  - type: web
    name: kishore-portfolio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_BASE
        value: /
    headers:
      # Long immutable cache for content-hashed assets
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # 1-day cache for static frames, sprites, and key media
      - path: /frames/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /frames_v1/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /frames_v2/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /sprite/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /center.webp
        name: Cache-Control
        value: public, max-age=86400
      # Basic security headers
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
